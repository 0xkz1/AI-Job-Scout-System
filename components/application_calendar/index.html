<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { --bg:#fff; --text:#31333f; --line:#d9dde3; --applied:#2779a7; --expired:#926c23; --accent:#944040; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--text); background:var(--bg); font-family:system-ui,sans-serif; }
    .weekdays,.week { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); }
    .weekdays { padding:8px 0; text-align:center; font-size:12px; opacity:.7; }
    .week { border-top:1px solid var(--line); }
    .day { border:0; border-right:1px solid var(--line); background:transparent; color:inherit; padding:10px;
           min-height:118px; width:100%; text-align:left; font:inherit; cursor:pointer; overflow:hidden;
           display:flex; flex-direction:column; align-items:stretch; justify-content:flex-start; }
    .day:last-child { border-right:0; }
    .day:hover { background:color-mix(in srgb,var(--text) 5%,transparent); }
    .day[aria-pressed="true"] { box-shadow:inset 0 0 0 2px var(--accent); }
    .day:focus-visible { outline:3px solid var(--applied); outline-offset:-3px; }
    .day:disabled { opacity:.25; cursor:default; }
    .number { font-size:16px; font-weight:600; font-variant-numeric:tabular-nums; }
    .today .number { border-bottom:2px solid var(--applied); }
    .events { display:grid; gap:4px; margin-top:10px; }
    .event { display:block; font-size:11px; line-height:1.35; padding-left:6px; border-left:2px solid; }
    .applied { color:var(--applied); }
    .expired { color:var(--expired); }
    .company,.role { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .company { font-weight:600; }
    .role { opacity:.8; font-size:10px; }
    .more { font-size:11px; opacity:.7; }
    .count { display:none; font-size:11px; margin-top:8px; }
    @media(max-width:550px) {
      .day { padding:8px 4px; min-height:76px; text-align:center; }
      .events { display:none; }
      .count { display:block; }
    }
  </style>
</head>
<body>
  <div class="weekdays" aria-hidden="true"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div>
  <div id="calendar" aria-label="応募と期限切れ確認のカレンダー"></div>
  <script>
    const send = (type, data={}) => window.parent.postMessage({isStreamlitMessage:true,type,...data}, "*");
    let selected = null;
    let currentKey = null;
    function resize() { send("streamlit:setFrameHeight", {height:document.body.scrollHeight+4}); }
    function render(args, theme) {
      if (theme) {
        const hex = String(theme.backgroundColor || "#ffffff").replace("#", "");
        const rgb = [0,2,4].map(offset=>parseInt(hex.slice(offset,offset+2),16));
        const dark = theme.base === "dark" || (rgb[0]*.2126+rgb[1]*.7152+rgb[2]*.0722 < 128);
        const styles = {"--bg":theme.backgroundColor,"--text":theme.textColor,
          "--line":dark?"#343b46":"#d9dde3","--accent":theme.primaryColor,
          "--applied":dark?"#83bce4":"#2779a7","--expired":dark?"#d9b06a":"#926c23"};
        Object.entries(styles).forEach(([key,value])=>document.documentElement.style.setProperty(key,value));
        document.body.style.fontFamily = theme.font || "system-ui,sans-serif";
      }
      const key = JSON.stringify(args.weeks.map(week=>week.map(day=>day.date)));
      if (currentKey !== key) { selected=args.selected; currentKey=key; }
      const calendar = document.getElementById("calendar");
      calendar.replaceChildren();
      args.weeks.forEach(week=>{
        const row = document.createElement("div"); row.className="week";
        week.forEach(day=>{
          const button=document.createElement("button"); button.type="button";
          button.className="day"+(day.today?" today":""); button.disabled=!day.inMonth;
          button.dataset.date=day.date; button.setAttribute("aria-pressed",String(day.date===selected));
          const descriptions=day.events.slice(0,3).map(event=>(event.kind==="applied"?"応募":"期限切れ確認")+"："+event.company+"、"+event.title);
          const remaining=day.events.length>3?"。ほか "+(day.events.length-3)+"件":"";
          button.setAttribute("aria-label",day.date+"、"+(descriptions.join("。")+remaining||"記録なし"));
          const number=document.createElement("span"); number.className="number"; number.textContent=day.day; button.append(number);
          const list=document.createElement("span"); list.className="events";
          day.events.slice(0,3).forEach(event=>{
            const entry=document.createElement("span"); entry.className="event "+event.kind;
            entry.title=(event.kind==="applied"?"応募":"期限切れ確認")+" · "+event.company+" · "+event.title;
            const company=document.createElement("span"); company.className="company";
            company.textContent=(event.kind==="applied"?"● ":"◆ ")+event.company;
            const role=document.createElement("span"); role.className="role"; role.textContent=event.title;
            entry.append(company,role); list.append(entry);
          });
          if(day.events.length>3) { const more=document.createElement("span"); more.className="more"; more.textContent="ほか "+(day.events.length-3)+"件"; list.append(more); }
          button.append(list);
          ["applied","expired"].forEach(kind=>{
            const count=day.events.filter(e=>e.kind===kind).length;
            if(count) {const badge=document.createElement("span");badge.className="count "+kind;badge.textContent=(kind==="applied"?"● ":"◆ ")+count;button.append(badge);}
          });
          button.addEventListener("click",()=>{
            selected=day.date;
            calendar.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.date===selected)));
            send("streamlit:setComponentValue",{value:selected,dataType:"json"});
          });
          row.append(button);
        });
        calendar.append(row);
      });
      requestAnimationFrame(resize);
    }
    window.addEventListener("message",event=>{
      if(event.source!==window.parent || event.data?.type!=="streamlit:render")return;
      render(event.data.args,event.data.theme);
    });
    window.addEventListener("resize",resize);
    send("streamlit:componentReady",{apiVersion:1});
  </script>
</body>
</html>
