[pytest]
# Only tests/ is the test suite. Without this, pytest collects any root-level
# file matching test_*.py — and three of those (test_scrape_all.py, test_gen.py,
# test_wordsmith.py, now renamed probe_*.py) were manual probe scripts with no
# test functions at all, whose module bodies ran a real 42-search Indeed scrape
# and real CV/cover-letter generation with real LLM calls. Pytest executes a
# module body at COLLECTION time, so every `pytest` run spent money and network
# on them, and on 2026-08-17 Indeed's Cloudflare challenge made one of them
# abort the entire suite before a single real test ran.
#
# testpaths only sets the default when no path is given on the command line, so
# it fixes `pytest` and `pytest -q`. norecursedirs is the belt-and-braces half:
# it keeps a future root-level test_*.py from being collected even when someone
# passes an explicit path like `pytest .`.
testpaths = tests
norecursedirs = .venv .git 10_output 15_reviews 20_pdfs wordsmith_test_output *_test_output
