employment_types:
- full_time
- part_time
- contract
- freelance
# Matched with word boundaries (see filter.passes_filter), so a term here will not
# fire on a longer word that merely contains it.
exclude_description_keywords:
- driver license
# Native-level German is a hard requirement the candidate cannot meet, and it
# appears in 6 of 13 Arbeitnow postings — the single biggest reason EU jobs are
# unusable. Only phrases VERIFIED present in the scraped corpus are listed;
# "fluent german", "german language skills", "fließend deutsch",
# "verhandlungssicheres deutsch" and the Spanish/French equivalents all matched zero
# postings, so they are left out. tests/test_german_language_filter.py fails if a
# phrase here stops matching anything, which is how the two guesses above got caught.
#
# The word boundary matters here: "deutschlandticket" (a commuter-pass perk) must
# NOT count as a language requirement. It appears in the Berlin posting that
# reviewed at 79 — the best EU match found — which a substring match would have
# thrown away.
- deutschkenntnisse            # incl. "sehr gute Deutschkenntnisse"
- gute deutsch                 # "sehr gute Deutsch- und Englischkenntnisse"
# Seniority, then trade. The seniority terms keep roles above the candidate's level
# out; the trade terms keep out professions the candidate cannot do at all.
#
# The trade list was added 2026-07-28 after measuring where reed's volume goes: of
# 531 filter-passing reed jobs, 289 scored under 0.35, and the commonest words in
# those titles were engineer, electrical, mechanical, technician. The composite
# score does not reject them reliably — "Electrical Design Engineer" reached 0.78,
# because "design" and "engineer" read as relevant to a product designer — so 54 of
# them sat in the ranked pool and every one had been paid for: filter-passing jobs
# go on to LLM enrichment. Excluding them at the title drops 118 jobs before that
# spend, and costs nothing measurable: NONE of the 118 is in the generation set.
#
# Every term below matches at least one real posting (tests/test_title_exclusions.py
# fails otherwise) — the German keyword list grew two invented phrases that way.
# "structural", "technician", "sales" and "estimator" were considered and left out:
# "Art Technician" reached composite 0.67 and "Sales Designer (Kitchens)" 0.50, so
# those words are not reliable trade markers here. The review score handles them
# instead — Art Technician reviewed at 30.
exclude_title_keywords:
- senior
- lead
- head of
- director
- manager
- electrical
- mechanical
- civil
- geotechnical
- quantity surveyor
- welder
- nurse
- driver
include_levels:
- entry_level
- mid
- internship
# Keyword x location is the multiplier on everything downstream: each pair is one
# serial search (~68s on reed), and each job it returns costs 2-5 LLM calls to
# analyse. Both lists are therefore kept to terms that actually yield.
#
# Dropped 2026-07-26, measured as share of scraped jobs reaching the top 30%:
#   Design Engineer     110 jobs -> 3  (2.7%)  pulls in mechanical/electrical/
#                                              geotechnical roles wholesale
#   Builder              26 -> 0  (0%)
#   Development Support   2 -> 0  (0%)
#   Birmingham           61 -> 3  (4.9%)
# Kept despite a low rate, by preference: Glasgow (39 -> 2), Dundee (10 -> 1).
# Best performers, for reference: Creative Technologist 66.7%, Technical Artist
# 42.9%, Digital Designer 40%, Web Designer 40%, Remote 37.9%, Edinburgh 33.3%.
#
# The six "bridge" terms below were added 2026-08-07. They target the roles that sit
# between the creative-technologist target and unrelated work — jobs that pay now
# without breaking the story. Each has its own CV profile, cover letter and outreach
# template, so a hit routes to a document set written for it.
#
# Ordered by how much English-language, synchronous client contact the job carries,
# which is the candidate's stated constraint: QA Analyst and Research Software
# Engineer are written-first work, Technical Support is written-first only where the
# channel is tickets rather than phone, and Implementation Consultant / Solutions
# Engineer / Digital Producer are meeting-heavy. All six are searched; the ranking
# matters when choosing which results to act on, not which to collect.
#
# Multi-word phrases, never bare "Implementation" or "Support": scraped jobs pass
# through filter_jobs_by_keywords, which keeps a job when ANY keyword appears in the
# title OR description. A single common word there would match nearly every posting
# and quietly disable that filter for the whole run.
keywords:
- Creative Technologist
- Technical Artist
- Web Developer
- Web Designer
- Digital Designer
- Designer
- Implementation Consultant
- Solutions Engineer
- Technical Support
- QA Analyst
- Digital Producer
- Research Software Engineer
# Manchester dropped 2026-08-07 to pay for the two keywords above. It is the weakest
# location on the list for this candidate: Edinburgh-based, needs work now, and a
# Manchester post is neither commutable nor a better relocation than London — which
# stays, as the one non-Scottish market big enough to be worth the searches.
locations:
- Edinburgh
- Dundee
- Glasgow
- London
- Remote

# Per-keyword location overrides (selection.search_pairs). A keyword listed here
# searches only these locations; anything absent keeps the full `locations` list.
#
# This exists because searches, not keywords, are the budgeted resource: reed runs
# ~34s per search at depth 3 against a 1500s cron timeout, so 44 pairs is the hard
# ceiling (invariants.check_scrape_fits_its_timeout). The full cross product of 12
# keywords x 5 locations is 60 pairs — 2040s, a guaranteed exit 124 and truncated
# descriptions.
#
# What is narrowed, and why:
#   * The six bridge terms run Edinburgh / Glasgow / Remote. These are jobs to take
#     now, in commuting distance or remote; a support or implementation role in
#     London is not one this search can act on.
#   * "Designer" and "Web Designer" give up London / Dundee. They are the two
#     broadest design terms and overlap most with "Digital Designer", which keeps its
#     full reach — so the design side loses the most duplicated coverage, not the
#     best-yielding.
#   * "Technical Artist" gives up London: the Scottish games cluster (Dundee,
#     Edinburgh, Glasgow) is the reachable one, and London studios hire on relocation.
#   * "Web Developer" gives up Dundee, the smallest of the four markets for it.
# Only "Creative Technologist" and "Digital Designer" keep every location — the two
# best-measured performers.
# Total: 42 pairs, ~1428s on reed. Two more pairs is the whole remaining headroom, so
# a new term needs an entry here or an existing one has to give way.
keyword_locations:
  Technical Artist: [Edinburgh, Dundee, Glasgow, Remote]
  Web Developer: [Edinburgh, Glasgow, London, Remote]
  Designer: [Edinburgh, Glasgow, Remote]
  Web Designer: [Edinburgh, Glasgow, Remote]
  Implementation Consultant: [Edinburgh, Glasgow, Remote]
  Solutions Engineer: [Edinburgh, Glasgow, Remote]
  Technical Support: [Edinburgh, Glasgow, Remote]
  QA Analyst: [Edinburgh, Glasgow, Remote]
  Digital Producer: [Edinburgh, Glasgow, Remote]
  Research Software Engineer: [Edinburgh, Glasgow, Remote]

# Locations only ONE site can search, appended to every keyword's location list
# for that site alone (selection.search_pairs). No other site sees them, so they
# cost nothing on reed/adzuna/guardian/indeed and do not move the 44-pair budget
# those sites are rationed by.
#
# Japan, remote only. The candidate is a Japanese national and can hold a fully
# remote Japanese role from the UK; an on-site Tokyo job is out of scope for the
# same reason on-site EU jobs are — no relocation. LinkedIn's guest endpoint
# expresses this as a country plus f_WT=2 (see scraper_linkedin_guest.
# _location_params), which is one ordinary search. reed and guardian are UK job
# boards and would read "Remote (Japan)" as a town name.
#
# Added 2026-08-19 as a MEASUREMENT pass, not a settled part of the budget, and
# two known gaps ride with it. The keywords are English, so these searches find
# English-titled postings in Japan and miss a "Webエンジニア" listing entirely.
# Downstream is English-only too: exclude_title_keywords cannot see シニア, so
# the level gate does not hold on a Japanese title. Both are decisions for what
# the first runs actually return, not guesses to encode now.
site_only_locations:
  linkedin:
  - Remote (Japan)

# What each keyword is called in the postings themselves. The relevance filter
# that runs after a scrape (scraper_indeed.filter_jobs_by_keywords) keeps a job
# only if a search term appears in its text — and a posting written in Japanese
# contains none of the English ones.
#
# MEASURED 2026-08-19 on one depth-1 pass of the Japan searches: 22 postings
# survived the full-remote gate and 3 survived the keyword filter. The 19 it cut
# were テクニカルアーティスト, Webエンジニア, QAエンジニア, ITサポート — the
# keywords themselves, in Japanese. The filter was doing language, not relevance.
#
# Deliberately per keyword, not a free list: an alias is what THAT keyword is
# called, so the filter stays as narrow as it is in English. Bare エンジニア is
# left out for the same reason "engineer" is not a keyword — it matches every
# posting in the market.
#
# These cost nothing on the UK sites, where no posting contains them.
keyword_aliases:
  Creative Technologist: [クリエイティブテクノロジスト]
  Technical Artist: [テクニカルアーティスト]
  Web Developer: [Webエンジニア, Web開発, ウェブ開発, フロントエンドエンジニア, Webアプリ]
  Web Designer: [Webデザイナー, ウェブデザイナー]
  Digital Designer: [デジタルデザイナー]
  Designer: [デザイナー]
  Implementation Consultant: [導入コンサルタント, 導入支援]
  Solutions Engineer: [ソリューションエンジニア, ソリューションズエンジニア, セールスエンジニア]
  Technical Support: [テクニカルサポート, サポートエンジニア, ITサポート]
  QA Analyst: [QAエンジニア, 品質保証, テストエンジニア]
  Digital Producer: [デジタルプロデューサー, Webプロデューサー, プロデューサー]
  Research Software Engineer: [リサーチエンジニア, 研究開発エンジニア]
max_pages_per_search: 3

# Per-site page depth, read through selection.max_pages_for (falls back to
# max_pages_per_search above). Depth costs wall-clock linearly: every site walks
# 9 keywords x 7 locations = 63 searches serially, and at depth 10 both reed and
# adzuna blew the 1500s per-site cron timeout and were killed mid-run — leaving
# the truncated descriptions that produced the unscoreable backlog. Guardian
# finished at 1421s, which is not comfortable either.
#
# Depth is only worth paying for where results actually live. Of jobs found on
# page 4+: reed 157 (22% of its 706, incl. 18 of the current top-30% set), adzuna
# 0. So reed keeps depth, adzuna does not.
#
# reed sits at 3 on a MEASURED timing budget, not a modelled one. A full run on
# 2026-07-26 took 68s per search at depth 6 — the earlier estimate of 14s counted
# only page navigation, and page navigation is not the cost. The description fetch
# is: serial, 1s apart, paid for every NEW posting, ~54 of the 68 seconds.
#
# At 30 searches (after the keyword/location cut above), depth 6 needs ~2040s
# against the 1500s cap; depth 3 needs ~1050s and fits with real headroom.
#
# Depth 3 costs nothing measurable here: re-counting the top 30% AFTER the keyword
# cut, reed page 4 contributes 0 — the 3 jobs it used to supply all came from
# "Design Engineer", now dropped. Pages 5 and 8-10 still hold 8 between them, but
# reaching page 10 costs ~2x the whole time budget for those 8. Raising depth again
# needs the description fetch made concurrent (scraper_helper notes an earlier
# attempt caused EPIPE) or a higher cap — not just a bigger number here, since a
# site that times out returns less than a shallow run that finishes.
#
# indeed sits at 1, not 3, because its description cost is per CARD and unavoidable.
# /viewjob is Cloudflare-blocked outright, so the description has to be read from
# the listing's preview pane one click at a time (scraper_indeed.
# _fill_descriptions_from_pane). Measured 2026-07-26: 52s for one page — 11s of
# fixed listing/Cloudflare overhead plus ~2.7s per card over 16 cards. At depth 1
# that is ~1620s across 30 searches, already past the 1500s cap, so indeed gets a
# longer per-site timeout in job_scout_nightly.sh instead of more depth. Cache hits
# cost nothing, so only the first night pays full price.
max_pages_per_site:
  reed: 3
  adzuna: 3
  guardian: 3
  indeed: 1
  linkedin: 3
min_salary_gbp: 26000
sites:
- reed
- guardian
- adzuna
- remote_apis
- indeed
- linkedin

# Boards this pipeline no longer wants, by the `source` each posting carries.
#
# Separate from `sites` above because they are not the same list. `remote_apis`
# is ONE site that returns postings tagged arbeitnow, remotive, weworkremotely
# and remoteok — dropping a board is not the same as dropping the scraper that
# reaches it, and "source not in sites" would take arbeitnow and remotive with
# it.
#
# Read on the way IN from staging (run.py load_all_from_saved). 00_saved is
# append-only by design — it is what let the scrape survive the nights the
# analysis was killed — so every --from-saved run replays a month of scrapes,
# and a source dropped only from the scraper keeps arriving anyway. 52 postings
# were purged from the database on 2026-08-27 and the next nightly put all of
# them back, out of the 15 staging files that still hold them; 19 were inside
# the generation set and about to be given fresh documents.
#
# Dropping a board here does NOT delete what it already produced. The staging
# files stay (they record what a scrape returned), and rows already in the
# database stay until something removes them.
dropped_sources:
- weworkremotely
- remoteok

# --- Multi-country / remote expansion (2026-07-25) ---
# Target countries for REMOTE roles, in priority order. A UK-resident on a YMS
# visa can hold these remotely; on-site abroad is out of scope (no relocation).
# Drives Adzuna country domains (scraper_adzuna) + relevance in matcher.
remote_target_countries:
- germany
- netherlands
- luxembourg
- france
- sweden
- norway
- finland
- switzerland
- austria
- spain

# Adzuna API country codes to query (subset of the above that Adzuna covers).
# Requires ADZUNA_APP_ID + ADZUNA_APP_KEY env (free tier). gb kept for UK.
adzuna_countries:
- gb
- de
- nl
- fr
- at
- es

# Remote roles locked to Americas working hours = night shifts from UK/JP.
# Hard-dropped in filter.py. Phrases kept specific to avoid false positives.
exclude_timezone_keywords:
- must be based in the us
- must be located in the us
- us residents only
- authorized to work in the us
- us work authorization
- americas time zone
- overlap with pst
- overlap with pacific time
- pacific time zone required
- eastern time zone required

# Composite match weights. Fitted against review verdicts on 139 documents with
# a real job description (r = +0.595 here vs +0.518 for the old 0.35/0.25/0.10/
# 0.01/0.29 split). Context carries most of it because it is the only component
# that reads the posting semantically, the way the reviewer does. experience is
# near-zero weight because its spread across postings is sd=0.024 (the
# candidate's years are fixed, so it barely varies), and salary is held at 0.01
# because it correlates NEGATIVELY with review outcome (r=-0.089). Skills keeps
# a real share: dropping it entirely scores worse (+0.557) than keeping it small.
#
# Re-measured 2026-08-11 on 419 jobs holding both an LLM context score and a
# stored CV review — three times the original sample. Context alone came back
# at +0.292, not the +0.562 recorded above, and skills at +0.100. The weights
# were refit against that: non-negative, summing to 1, scored out-of-sample over
# five folds. The refit LOST on all five seeds (-0.003 to -0.028), so it was not
# applied and these numbers stand. Capping context by skills lost at every
# margin too. Both failed for the same reason — every dimension is a weak
# predictor, so no linear recombination of them has anywhere to go.
#
# What did work was fixing the input rather than the arithmetic: context now
# scores whether the candidate could DO the job (r=+0.459) instead of whether
# they would want it (r=+0.294). Note the refit wanted to zero location and
# salary — cv_review_score is the wrong target for those, because the reviewer
# never sees where a job is or what it pays. Do not fit those two against it.
# Rebalanced 2026-08-23 against the CV review score, which is the only signal
# here with a human-checked meaning. Measured over the 754 postings that carry
# both a match and a review, each component's correlation with that review:
#
#   skills  +0.237      context +0.238      location +0.075
#   experience +0.070   salary  -0.117
#
# skills and context predict the review EQUALLY well, and context was carrying
# 3.2x the weight. It is also the unstable one: the same posting, same persona,
# same code, scored nine times, returned 0.40 / 0.55 / 0.65 / 0.65 / 0.70 /
# 0.72 / 0.75 / 0.80 / 0.88 and failed twice. A spread of 0.48 on a term worth
# 0.64 moves the composite by 0.31 — enough to carry a job from Weak to Good on
# the draw alone, which is what sent a batch of url-list postings out looking
# weak. skills, by contrast, reproduced exactly.
#
# So: give the steady term the larger share, and cut the noisy one's leverage.
# Grid search on a 70/30 split put the optimum at skills 0.45 / context 0.50
# with experience and location at zero (test r 0.316 against the old weights'
# 0.264). This keeps those two instead: their low correlation is not evidence
# they do not matter but that they barely vary across postings that survive the
# filter — location is a hard constraint on whether the job can be taken at
# all, not a soft preference. Doing so costs almost nothing measurable (test r
# 0.306 vs 0.316, well inside the noise between candidates).
#
# salary goes to zero because its correlation is NEGATIVE: a better-paying
# posting reviews slightly worse. Weighting it at all was scoring the wrong
# direction. This does not stop salary filtering — min_salary_gbp is a filter,
# not a weight.
#
# RE-MEASURED 2026-08-26, after three bugs in the skills term were fixed (the
# design-skill unlock, an unreadable "Design" counted as a gap, and optional
# "nice to have" requirements scored as gaps). Same method, 757 postings:
#
#   skills  +0.202      context +0.237      location +0.074
#   experience +0.068   salary  -0.098
#
# The equality above no longer holds — corrected skills predicts the review
# LESS well than it did while inflated (+0.237 -> +0.202), and the composite
# with it drops from +0.373 to +0.350. That is recorded rather than acted on,
# because agreement with the review score cannot adjudicate those fixes: the
# reviewer is an LLM reading the same posting with the same pull toward surface
# keyword overlap, so a bug that credits a designer's skill to a bank's
# insider-risk role is one both systems shared. The fixes stand on named cases
# where the matcher was factually wrong about what a job asked for.
#
# The weights themselves survive the re-measurement, which is what it was for.
# Twelve 70/30 splits put every per-split optimum inside skills 0.35-0.45 and
# context 0.40-0.45, and these weights average test r +0.352 against the best
# alternative's +0.353 and the old weights' +0.317. No change.
#
# Every split also wanted experience at 0.10 rather than 0.05. Ignored: the
# experience score is 0.95 at the median across the whole database, so its
# weight acts as a near-constant offset that cannot reorder anything, and
# reading that as signal would be reading the grid's ceiling.
weights:
  skills: 0.45
  experience: 0.05
  location: 0.10
  salary: 0.00
  context: 0.40

# A stored context score is reused forever, which is right when the score means
# something and wrong when it was one draw of a measurement that does not
# repeat. The same posting, persona and code scored nine times returned 0.40 to
# 0.88; skills, measured the same way, reproduced exactly.
#
# So reuse is kept, and one case is carved out of it: a LOW stored context under
# HIGH skills. The two axes contradicting each other is evidence about the noisy
# one. Such a job is drawn once more and the two draws averaged.
#
# Measured on the 4860-job database (2026-08-24):
#
#   context_source llm      3888   (reused; frozen at whatever was drawn)
#   context_source tfidf     972   (not reused — re-scored on the next pass anyway)
#   of the 3888: ctx <= 0.30                    2186 (56%)
#                ctx <= 0.30 AND skills >= 0.50  420  <- what this re-draws
#
# 420 extra calls, once, then never again for those jobs: max_draws stops the
# trigger the moment the second draw lands, so the cost does not repeat every
# night. Jobs the filter rejected are excluded by skip_llm_context and pay
# nothing, as before.
#
# skills_min 0.50 is where the disagreement is real rather than both terms
# simply reading low — the median skills score in the database is 0.30.
context_rescore:
  enabled: true
  context_max: 0.30
  skills_min: 0.50
  max_draws: 2

# Review submission gate: CV/CL scoring >= this is badged 提出可 (badge only)
review_score_threshold: 85

# --- Per-stage selection (primary control) ---
# Each stage acts on the top N% of the ranked, filter-passed pool. One number
# per stage, read through selection.py so generation and review stay in step.
generation_top_percent: 30   # top N% get a CV + cover letter (paired)
# Was 30 and unused: nightly_scout.py gated review on an absolute
# composite_score floor (REVIEW_MIN=0.80) and never called
# select_top("review", ...), so this value governed nothing. Wired in and set to
# 40 on 2026-08-06 — review now follows the same ranked-pool percentile that
# generation does, instead of a second, hand-rolled mechanism.
#
# Effect on the current pool: 488 of 1178 ranked jobs, cutting at composite 0.53,
# against 23 under the old 0.80 floor. A percentage rather than a floor so the
# nightly review count tracks the pool instead of spiking on a night that
# happens to scrape many strong matches.
review_top_percent: 40       # top N% by composite_score get reviewed

# The stretch tier: postings the LEVEL gate rejected that still get a CV, a
# cover letter and a review, so the review score can be read instead of guessed.
# A filtered job otherwise gets no documents and therefore no review — which
# makes it unjudgeable rather than merely deprioritised.
#
# Deliberately a small count, not a percentage. 187 postings are filtered as
# senior; 93 of those have a level-neutral title (selection.stretch_jobs drops
# "Principal ...", "Staff ...", "Sr. ..." — seniority in the discipline itself,
# which no document changes). Generating for all 93 is ~465 model calls for a
# tier that is a stretch by definition. 15 is roughly 75 calls and reaches far
# enough down the skills ranking to include the kind of posting this exists for:
# a Creative Technologist/AI Specialist role built around Claude Code, MCP and
# agents, called senior on "5 years React, 1 year AWS", ranked 12th.
#
# Set to 0 to switch the tier off.
stretch_top_count: 15

# Jobs analysed and matched per checkpoint. The DB is written after each chunk,
# so a run that is killed keeps every chunk it finished — see run.py's _persist.
#
# 200 comes from what the nightly can actually do: the analysis stage is left
# ~1200s after the scrapes, and on 2026-08-21 that bought under 100 enrichments,
# all of them discarded because the only write was at the end of the run. A
# smaller chunk checkpoints sooner; a larger one wastes less time on the write
# itself (~37MB of JSON, under a second). 200 keeps a lost chunk cheap while the
# 1973-job backlog drains over a few nights.
#
# 0 restores the old single-pass behaviour — everything or nothing.
analysis_chunk_size: 200

# How many jobs are enriched at once. The pass waits on providers rather than
# computing, so one job at a time left the CPU idle for ~15s per posting and made
# the backlog an overnight job on its own.
#
# The limit is live keys, not cores. Every call walks the fallback chain from the
# top, so N workers open N simultaneous calls against the same first provider;
# exceed its requests-per-second and it answers 429, which quarantines a WORKING
# key for 15 minutes (see key_quarantine's RATE_LIMIT_COOLDOWN_MINUTES) and moves
# the same crowd onto the next key. 4 against 16 Mistral plus 12 groq keys leaves
# the chain room to absorb a throttled provider without cascading.
#
# Measured on the 2026-08-21 backlog: at 4 workers a 154-job chunk enriched in
# 31 minutes (~5 jobs/min) against ~3 serial, and NOTHING was rate-limited — no
# 429, no quarantine — so the chain was nowhere near its ceiling and the width
# was the limit, not the keys.
#
# 1 restores the old serial pass.
analysis_workers: 8

# Review a document as soon as it is written, instead of leaving every review to
# nightly_scout at the end of the pipeline.
#
# Two problems it fixes, not one. Reviews are the LAST stage, so a top-ranked
# posting waited behind every remaining document — Pony Visual Designer sat at
# composite 0.82, rank 33 of 4492, with a CV and a letter and no verdict, which
# is the number that actually decides whether to apply. And nightly_scout only
# looks at jobs that are NEW in that run, so a document that misses its night is
# never reviewed by it at all: that backlog was 341 documents on 2026-08-22.
#
# It bypasses no selection. review_top_percent (40) is a superset of
# generation_top_percent (30) over the same ranked pool with the same floor, so
# a job holding a CV is already inside the review set. nightly_scout still
# sweeps and skips what is already reviewed.
review_on_generation: true

# Absolute composite, not a rank: at this point in the run every job is scored,
# so the rank is known and this is only a floor under it. Documents are reviewed
# best-first, so a slot that runs out has done the ones worth reading.
review_on_generation_min: 0.5

# Quality floor (secondary): a job below this composite score never gets a CV
# even if it lands inside the top N% of a small pool. It only trims — it never
# widens the selection. Set to 0 to disable.
#
# Must stay BELOW the top-N% cutoff, or it silently becomes the real selector.
# It sat at 0.60 while the weight rebalance moved the median composite to 0.40,
# which cut 75 of the top 143 jobs and shrank "top 30%" to 68 — and dropped 6 of
# the 31 jobs that reviewed at 73+. Re-fit against those review outcomes: 0.45
# lost none of them. Re-check this number whenever `weights` OR the meaning of
# a dimension changes, since it is an absolute score and they decide the scale.
#
# 0.45 -> 0.32 on 2026-08-11, when context stopped measuring whether the
# candidate would WANT a job and started measuring whether they could DO it.
# That moved mean context 0.444 -> 0.272 and mean composite 0.425 -> 0.354, so
# 0.45 would have passed 227 of the 927 rescored jobs where it used to pass 485
# — halving the pipeline for a reason that has nothing to do with the jobs.
# 0.32 passes 498, holding the volume the floor was tuned to.
match_score_threshold: 0.32

# Safety cap on how many NEW CVs one run may generate, independent of percent
# (0 = no cap). Guards against a huge first run; top-% is the real selector.
cv_generation_limit: 150
